    <div class="side-caption">MENU PRINCIPAL</div>

    <nav id="nav">

        <div>
          <b>Ambiente demonstrativo</b>
          <small>Base local com dados fictícios</small>
        </div>
      </div>

      <div class="profile">
        <div class="avatar">AC</div>
        <div class="profile-copy">
          <b>AgroControl Demo</b>
          <small>Administrador</small>
        </div>
        <div class="profile-chevron" data-icon="chevron-down"></div>
      </div>

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu"></button>
        <div class="crumb"><span class="crumb-home" data-icon="home"></span> <span>Painel</span> <em>/</em> <strong id="crumb">Visão geral</strong></div>
      </div>
      <div class="top-actions">
        <span class="demo-pill"><span class="demo-dot"></span> DEMONSTRAÇÃO</span>
        <span class="today-wrap"><span class="calendar-icon" data-icon="calendar"></span><span class="today" id="today"></span></span>
        <span class="top-sep"></span>
        <div class="top-profile"><div class="top-avatar">AC</div><span class="top-chevron" data-icon="chevron-down"></span></div>
      </div>
    </header>

    <main class="content" id="content"></main>
    <footer>AgroControl © 2026 · Versão demonstrativa premium · Dados fictícios salvos neste navegador</footer>
  </div>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Novo registro</h2>
      <button id="closeModal" class="icon-button" aria-label="Fechar"></button>
    </div>
    <form id="modalForm">
      <div class="form-grid" id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-soft" id="cancelModal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar registro</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>

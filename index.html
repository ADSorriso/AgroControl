<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08261c">
  <title>AgroControl Premium | Gestão Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="assets/agrocontrol-logo.png" alt="AgroControl Gestão Inteligente">
    </div>

    <div class="side-caption">MENU PRINCIPAL</div>

    <nav id="nav">
      <button class="nav-item active" data-page="dashboard"><span class="nav-icon" data-icon="dashboard"></span><span>Visão geral</span></button>
      <button class="nav-item" data-page="machines"><span class="nav-icon" data-icon="tractor"></span><span>Máquinas</span></button>
      <button class="nav-item" data-page="expenses"><span class="nav-icon" data-icon="wallet"></span><span>Despesas</span></button>
      <button class="nav-item" data-page="maintenance"><span class="nav-icon" data-icon="wrench"></span><span>Manutenções</span></button>
      <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="chart"></span><span>Relatórios</span></button>
    </nav>

    <div class="sidebar-bottom">
      <div class="status-card">
        <div class="status-icon" data-icon="leaf"></div>
        <div>
          <b>Ambiente demonstrativo</b>
          <small>Base local com dados fictícios</small>
        </div>
      </div>

      <div class="profile">
        <div class="avatar">AC</div>
        <div class="profile-copy">
          <b>AgroControl Demo</b>
          <small>Administrador</small>
        </div>
        <div class="profile-chevron" data-icon="chevron-down"></div>
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu"></button>
        <div class="crumb"><span class="crumb-home" data-icon="home"></span> <span>Painel</span> <em>/</em> <strong id="crumb">Visão geral</strong></div>
      </div>
      <div class="top-actions">
        <span class="demo-pill"><span class="demo-dot"></span> DEMONSTRAÇÃO</span>
        <span class="today-wrap"><span class="calendar-icon" data-icon="calendar"></span><span class="today" id="today"></span></span>
        <span class="top-sep"></span>
        <div class="top-profile"><div class="top-avatar">AC</div><span class="top-chevron" data-icon="chevron-down"></span></div>
      </div>
    </header>

    <main class="content" id="content"></main>
    <footer>AgroControl © 2026 · Versão demonstrativa premium · Dados fictícios salvos neste navegador</footer>
  </div>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Novo registro</h2>
      <button id="closeModal" class="icon-button" aria-label="Fechar"></button>
    </div>
    <form id="modalForm">
      <div class="form-grid" id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-soft" id="cancelModal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar registro</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
